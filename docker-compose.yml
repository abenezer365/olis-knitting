# Local / team development stack: MySQL + API.
# Production should point the API at a managed MySQL via env vars instead of `db`.
#
#   cp server/.env.example server/.env   # then fill in secrets
#   docker compose up --build            # start db + api
#   docker compose exec api npm run seed # load demo data (dev only)

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-olis_knitting}
      MYSQL_USER: ${DB_USER:-olis}
      MYSQL_PASSWORD: ${DB_PASSWORD:-olis_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Tables are created on first boot of an empty volume.
      - ./server/schema/table.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-olis_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # Inside the compose network the DB host is the service name.
      DB_HOST: db
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
